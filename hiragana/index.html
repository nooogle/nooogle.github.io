<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiragana drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --card:#FAFBF7; --ink:#1C2333; --muted:#5F6674; --line:#CDD2C6; --guide:#C3CABB;
  --accent:#27407A; --accent-ink:#FFFFFF; --ok:#2F7D4F; --bad:#C2412D; --on-status:#FFFFFF;
  --l0:#E1E4DC; --l1:#F2C7BC; --l2:#F3DDA6; --l3:#C9E0B1; --l4:#8CC49C;
  --kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12161E; --card:#1B212C; --ink:#E6E9EF; --muted:#9AA1AE; --line:#2E3644; --guide:#3A4354;
    --accent:#93ABEA; --accent-ink:#0F1420; --ok:#6CC08A; --bad:#EE7A64; --on-status:#0F1420;
    --l0:#232A36; --l1:#6A3328; --l2:#665324; --l3:#3D5A30; --l4:#2F6E48;
  }
}
:root[data-theme="dark"]{
  --paper:#12161E; --card:#1B212C; --ink:#E6E9EF; --muted:#9AA1AE; --line:#2E3644; --guide:#3A4354;
  --accent:#93ABEA; --accent-ink:#0F1420; --ok:#6CC08A; --bad:#EE7A64; --on-status:#0F1420;
  --l0:#232A36; --l1:#6A3328; --l2:#665324; --l3:#3D5A30; --l4:#2F6E48;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:500;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:10px 18px 36px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kana{font-family:var(--kana)}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 8px}
.top h1{font-size:1.15rem;font-weight:700;margin:0}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:700}

.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:6px 0 10px}
.lead{font-size:1.5rem;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.55}
.primary{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem}
.secondary{display:block;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;margin-top:10px}
.danger{display:block;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--bad);background:transparent;color:var(--bad);font-weight:700;margin-top:22px}
.pace{color:var(--muted);font-size:.92rem;line-height:1.55;margin:4px 2px 8px}

.chart h2{font-size:.95rem;margin:18px 2px 8px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:3px 0;text-align:left}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:1}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-family:var(--kana);font-size:1.45rem;font-weight:600;background:var(--l0)}
.row.off .cell{color:var(--muted);background:transparent;border:1.5px dashed var(--line)}
.tag{width:40px;flex:none;font-size:.82rem;font-weight:700;color:var(--accent);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:16px 2px 0}
.howlink{margin:22px 2px 0;font-size:.95rem}
.howlink a,.sheet a{color:var(--accent);font-weight:700;text-underline-offset:3px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}

.sbar{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--l0);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:.85rem;color:var(--muted);min-width:3.5em;text-align:right}
.stage{display:flex;flex-direction:column;align-items:center}
.ask{color:var(--muted);margin:4px 0 12px;font-weight:700}
.sq,.wsq{position:relative;aspect-ratio:1;background:var(--card);border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center}
.sq{width:min(62vw,240px)}
.wsq{width:min(84vw,320px)}
.sq::before,.wsq::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed var(--guide)}
.sq::after,.wsq::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed var(--guide)}
.sq .big{position:relative;z-index:1;font-family:var(--kana);font-size:min(38vw,150px);line-height:1;font-weight:400}
.sq .roma{position:relative;z-index:1;font-size:min(15vw,60px);font-weight:700}
.model{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kana);font-size:min(60vw,230px);line-height:1;color:var(--accent);opacity:0;z-index:1;pointer-events:none}
.model.show{opacity:.3}
.ans{position:relative;width:min(38vw,140px);aspect-ratio:1;margin-top:14px;background:var(--card);border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center}
.ans::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed var(--guide)}
.ans::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed var(--guide)}
.ans .kana{position:relative;z-index:1;font-size:min(28vw,104px);line-height:1}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
.romaline{font-size:2rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:12px}
.romaline .spk{margin:0}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:20px}
.opt{padding:16px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:1.35rem;font-weight:700;min-height:66px}
.opt.ko{font-family:var(--kana);font-size:2.2rem;font-weight:600;padding:8px}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--on-status)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--on-status)}
.opt:disabled{cursor:default;opacity:1}
.fb{width:100%;min-height:24px;margin-top:14px;text-align:center}
.fb p{margin:0 0 12px;line-height:1.6}
.fb .kana{font-size:1.5em}
.reveal{font-size:2rem;font-weight:700;margin:14px 0 0}
.spk{border:1.5px solid var(--line);background:var(--card);border-radius:999px;width:48px;height:48px;display:grid;place-items:center;margin:14px auto 0;color:var(--accent)}
.play{position:relative;z-index:1;width:116px;height:116px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--accent);display:grid;place-items:center}
.mute{margin-top:14px}
.dk{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:700}
.hint{color:var(--muted);font-size:.9rem;text-align:center;line-height:1.5;margin:14px 8px 18px}
.btns2{display:flex;gap:10px;width:100%;margin-top:18px}
.btns2 button{margin:0;flex:1}
.stage > .primary{margin-top:18px}

.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:1.25rem}
.sheet h3{margin:22px 0 6px;font-size:1rem}
.preview{font-size:2.4rem;letter-spacing:.12em;margin:4px 0 10px}
.field{display:block;font-weight:700;margin:12px 0}
.field select{display:block;margin-top:6px;width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.field input{display:block;margin-top:6px;width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;margin:14px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%;min-height:70px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:inherit;font-size:.85rem;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:20;font-weight:700}
.nav{display:flex;gap:14px}
.rep h2{font-size:1rem;margin:24px 2px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:1.6rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.85rem;line-height:1.4}
.bars{display:flex;gap:4px;height:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{display:block;width:100%;max-width:18px;border-radius:4px 4px 0 0;background:var(--accent)}
.bcol.zero .bar{background:var(--line)}
.blab{font-size:.7rem;color:var(--muted)}
.bcol.today .blab{color:var(--ink);font-weight:700}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1.5px dashed var(--line)}
.stack i{display:block;height:100%}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li span:last-child{color:var(--muted);text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.chip .kana{font-size:1.6rem}
.chip small{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

function buildPractice(rowId){
  let ids=activeCards().filter(id=>rowId?BY[id.split('|')[0]].row===rowId:!!S.cards[id]);
  const score=id=>{const c=S.cards[id];return cardScore(id)-Math.min(c?c.lapses:0,3)*0.5+Math.random()*1.5;};
  ids=ids.map(id=>[score(id),id]).sort((a,b)=>a[0]-b[0]).slice(0,rowId?20:15).map(x=>x[1]);
  return spread(ids);
}
// One card for every hiragana already started, shuffled; runs as practice so it doesn't disturb the schedule
function buildRunThrough(){
  const ids=[];
  KANA.forEach(it=>{const started=activeCards().filter(id=>id.startsWith(it.k+'|')&&S.cards[id]);
    if(started.length)ids.push(started[Math.floor(Math.random()*started.length)]);});
  return spread(ids);
}

const app=document.getElementById('app');
// Voice clips: Google Cloud Text-to-Speech, one MP3 per kana in audio/, named by romaji (ぢ and づ as di and du)
const AUDIO_FILE=k=>{const it=BY[k];return it?'audio/'+({'ぢ':'di','づ':'du'}[k]||it.r)+'.mp3':null;};
const hasTTS='speechSynthesis' in window;
const canSpeak=true;
const player=new Audio();player.preload='auto';
let audioReady=false;
function unlockAudio(){
  // iOS only lets audio play without a tap once the player has been started from a tap
  if(audioReady)return;audioReady=true;
  try{player.src=AUDIO_FILE('あ');player.muted=true;
    // only stop the silent unlock clip, never a real sound that started on the same tap
    const p=player.play();if(p&&p.then)p.then(()=>{if(player.muted){player.pause();player.muted=false;}},()=>{player.muted=false;audioReady=false;});else player.muted=false;}catch(e){audioReady=false;}
}
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('click',unlockAudio);
const toKata=t=>[...t].map(c=>{const n=c.charCodeAt(0);return n>=0x3041&&n<=0x3096?String.fromCharCode(n+0x60):c;}).join('');
function speakTTS(text,onDone){
  if(!hasTTS)return false;
  try{
    // Katakana makes the phone read は and へ as "ha" and "he", not as the particles "wa" and "e"
    const u=new SpeechSynthesisUtterance(toKata(text));u.lang='ja-JP';u.rate=0.7;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));
    const v=vs.find(v=>/premium|enhanced|natural|neural/i.test(v.name))||vs[0];if(v)u.voice=v;
    u.onend=onDone;u.onerror=onDone;
    speechSynthesis.cancel();speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
// soundDone settles once the current sound has finished playing, plus a short gap.
// Moving to the next card, and a new card's own sound, both wait for it so nothing gets cut off.
const SOUND_GAP=350,SOUND_MAX=3000;
let soundDone=Promise.resolve(),endSound=null;
function autoSpeak(k){
  const s=sess,p=s&&s.pos;
  soundDone.then(()=>{if(sess===s&&(!s||s.pos===p))speak(k);});
}
function speak(text){
  if(endSound)endSound(); // a new sound replaces one that's still going
  let settled=false,resolve;
  soundDone=new Promise(r=>{resolve=r;});
  const finish=()=>{if(settled)return;settled=true;if(endSound===finish)endSound=null;setTimeout(resolve,SOUND_GAP);};
  endSound=finish;
  setTimeout(finish,SOUND_MAX); // never wait forever if the phone doesn't report the end
  const clip=AUDIO_FILE(text);
  if(clip&&S.settings.voice!=='phone'){
    try{player.onended=finish;player.onerror=finish;player.muted=false;player.src=clip;player.currentTime=0;
      const p=player.play();if(p&&p.catch)p.catch(finish);return soundDone;}catch(e){}
  }
  if(!speakTTS(text,finish))finish();
  return soundDone;
}
const SPK_ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const PLAY_ICON=SPK_ICON.replace('width="22" height="22"','width="56" height="56"');
// "Don't know" counts as a miss, so the card comes back soon instead of being rewarded for a lucky guess
const DK='<button class="dk" data-act="answer" data-k="?">Don\'t know</button>';
function spkBtn(k){return canSpeak?`<button class="spk" data-act="speak" data-k="${k}" aria-label="Play sound">${SPK_ICON}</button>`:'';}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}
function level(it){
  if(!S.rows.includes(it.row))return -1;
  // With writing switched off, score on reading and recall only, scaled so "solid" is still reachable
  const ts=S.settings.write===false?['read','recall']:TYPES;
  const avg=ts.reduce((a,t)=>a+cardScore(it.k+'|'+t),0)/ts.length;
  return avg<1.5?1:avg<2.5?2:avg<3.5?3:4;
}
function streak(){
  const days=new Set(S.log.map(l=>ymd(new Date(l.t))));
  const d=new Date();if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function nextDueText(){
  let min=Infinity;for(const id of activeCards()){const c=S.cards[id];if(c&&c.due<min)min=c.due;}
  if(min===Infinity)return '';
  const diff=min-Date.now();
  if(diff<3600e3){const m=Math.max(1,Math.round(diff/60000));return `More cards will be ready in about ${m} ${m===1?'minute':'minutes'}.`;}
  const d=new Date(min),today=new Date();
  if(ymd(d)===ymd(today))return `More cards will be ready at ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}.`;
  const tm=new Date();tm.setDate(tm.getDate()+1);
  if(ymd(d)===ymd(tm))return 'More cards will be ready tomorrow.';
  return `More cards will be ready on ${d.toLocaleDateString('en-GB',{weekday:'long'})}.`;
}
function paceText(){
  const st=streak();
  return st>=2?`You've practised ${st} days running.`:'';
}

const TYPE_NAME={read:'Reading (kana to sound)',recall:'Picking the kana from romaji',listen:'Listening',write:'Writing'};
const kindOf=l=>{const t=l.id.split('|')[1];return t==='recall'&&l.v==='listen'?'listen':t;};
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
function reportData(){
  const DAY=864e5,today=new Date();today.setHours(0,0,0,0);
  const log=S.log.filter(l=>l.m!=='placement'); // placement checks aren't practice
  const days=[];
  for(let i=13;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push({key:ymd(d),label:d.toLocaleDateString('en-GB',{weekday:'narrow'}),n:0,ms:0});}
  const byKey=Object.fromEntries(days.map(d=>[d.key,d]));
  log.forEach(l=>{const d=byKey[ymd(new Date(l.t))];if(d){d.n++;d.ms+=Math.min(l.ms||0,30000);}});
  const weekStart=today.getTime()-6*DAY,week=log.filter(l=>l.t>=weekStart);
  const types={read:{n:0,ok:0},recall:{n:0,ok:0},listen:{n:0,ok:0},write:{n:0,ok:0}};
  week.forEach(l=>{const t=types[kindOf(l)];t.n++;if(l.ok)t.ok++;});
  const misses={},pairs={};
  log.filter(l=>l.t>=today.getTime()-13*DAY&&!l.ok).forEach(l=>{
    const k=l.id.split('|')[0];misses[k]=(misses[k]||0)+1;
    if(l.c){const p=[k,l.c].sort().join('');pairs[p]=(pairs[p]||0)+1;}
  });
  const levels=[0,0,0,0,0];KANA.forEach(it=>{const v=level(it);if(v>=1)levels[v]++;});
  const w=days.slice(7);
  return {days,types,levels,
    added:KANA.filter(it=>S.rows.includes(it.row)).length,
    activeDays:w.filter(d=>d.n).length,
    answers:week.length,ok:week.filter(l=>l.ok).length,dk:week.filter(l=>l.dk).length,
    mins:Math.round(w.reduce((a,d)=>a+d.ms,0)/60000),
    hard:Object.entries(misses).sort((a,b)=>b[1]-a[1]).slice(0,8),
    pairs:Object.entries(pairs).filter(p=>p[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,4),
    last:S.log.length?S.log[S.log.length-1].t:null};
}

  sess=null;
  const R=reportData(),max=Math.max(1,...R.days.map(d=>d.n)),st=streak();
  const bars=R.days.map((d,i)=>`<div class="bcol${d.n?'':' zero'}${i===13?' today':''}" aria-label="${d.n} answers"><span class="bwrap"><span class="bar" style="height:${d.n?Math.max(4,Math.round(d.n/max*100)):3}%"></span></span><span class="blab">${d.label}</span></div>`).join('');
  const types=['read','recall','listen','write'].filter(k=>R.types[k].n).map(k=>`<div class="li"><span>${TYPE_NAME[k]}</span><span>${pct(R.types[k].ok,R.types[k].n)} of ${R.types[k].n}</span></div>`).join('')||'<div class="li"><span>No answers this week yet</span></div>';
  const names=['','Learning','Shaky','Good','Solid'];
  const lastText=R.last?`Last practised ${new Date(R.last).toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.`:'No practice yet.';
  app.innerHTML=`<header class="top"><h1>Progress</h1><button class="link" data-act="home">Back</button></header>
  <div class="rep">
    <p class="pace">${lastText}${st>=2?` ${st} days in a row.`:''}</p>
    <div class="stats">
      <div class="stat"><b>${R.activeDays} of 7</b><span>days practised this week</span></div>
      <div class="stat"><b>${R.answers}</b><span>answers this week, about ${R.mins} min</span></div>
      <div class="stat"><b>${pct(R.ok,R.answers)}</b><span>right this week</span></div>
      <div class="stat"><b>${R.added} of ${KANA.length}</b><span>hiragana added</span></div>
    </div>
    <h2>Answers each day, last two weeks</h2><div class="bars">${bars}</div>
    <h2>How solid they are</h2>
    <div class="stack">${[1,2,3,4].map(i=>`<i style="width:${(R.levels[i]/KANA.length*100).toFixed(2)}%;background:var(--l${i})"></i>`).join('')}</div>
    <div class="legend">${[1,2,3,4].map(i=>`<span><i style="background:var(--l${i})"></i>${names[i]} ${R.levels[i]}</span>`).join('')}<span>Not added ${KANA.length-R.added}</span></div>
    <h2>Accuracy this week</h2><div class="list">${types}${R.dk?`<div class="li"><span>Don't know (counted as misses)</span><span>${R.dk}</span></div>`:''}</div>
    ${R.hard.length?`<h2>Most missed, last two weeks</h2><div class="chips">${R.hard.map(([k,n])=>`<span class="chip"><span class="kana">${k}</span><small>${BY[k].r}, missed ${n}</small></span>`).join('')}</div>`:''}
    ${R.pairs.length?`<h2>Often mixed up</h2><div class="list">${R.pairs.map(([p,n])=>`<div class="li"><span class="kana" style="font-size:1.5rem">${[...p].join(' and ')}</span><span>${n} times</span></div>`).join('')}</div>`:''}
    <button class="primary" data-act="share" style="margin-top:24px">Share this report</button>
    <p class="hint">Placement checks aren't counted. Minutes are estimated from answer times.</p>
  </div>`;

function reportText(){
  const R=reportData();
  const lines=['Hiragana progress, '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),
    `Practised on ${R.activeDays} of the last 7 days`,
    `${R.answers} answers this week (about ${R.mins} min), ${pct(R.ok,R.answers)} right`,
    `${R.added} of ${KANA.length} hiragana added: ${R.levels[4]} solid, ${R.levels[3]} good, ${R.levels[2]} shaky, ${R.levels[1]} learning`];
  ['read','recall','listen','write'].forEach(k=>{const t=R.types[k];if(t.n)lines.push(`${TYPE_NAME[k]}: ${pct(t.ok,t.n)} of ${t.n}`);});
  if(R.dk)lines.push(`Tapped "Don't know" ${R.dk} ${R.dk===1?'time':'times'}`);

  if(R.pairs.length)lines.push('Mixed up: '+R.pairs.map(([p])=>[...p].join('/')).join(', '));
  return lines.join('\n');
}

// ---------- Session ----------
let sess=null;
function startSession(mode,queue){
  if(!queue.length){toast('Nothing to practise yet');return;}
  sess={mode,queue,pos:0,right:0,wrong:0,requeued:new Set(),answered:false};
  renderCard();
}
function pickOptions(it){
  const active=KANA.filter(x=>S.rows.includes(x.row));
  const ok=x=>x.k!==it.k&&x.s!==it.s;
  const pool=active.filter(ok);
  const conf=shuffle(pool.filter(x=>CONFMAP[it.k]&&CONFMAP[it.k].has(x.k))).slice(0,2);
  let chosen=conf.concat(shuffle(pool.filter(x=>!conf.includes(x))));
  if(chosen.length<3)chosen=chosen.concat(shuffle(KANA.filter(x=>ok(x)&&!chosen.includes(x))));
  return shuffle([it,...chosen.slice(0,3)]);
}
function bar(){
  const pct=Math.round(sess.pos/sess.queue.length*100);
  return `<div class="sbar"><button class="link" data-act="home">Stop</button><div class="prog"><i style="width:${pct}%"></i></div><span class="count">${sess.pos}/${sess.queue.length}</span></div>`;
}
function renderCard(){
  if(sess.pos>=sess.queue.length)return renderDone();
  const id=sess.queue[sess.pos],[k,type]=id.split('|'),it=BY[k];
  sess.answered=false;sess.t0=performance.now();sess.listen=false;
  if(type==='read'&&!S.cards[id]&&sess.mode==='review'){
    app.innerHTML=`${bar()}<div class="stage"><p class="ask">New one to learn</p><div class="sq"><span class="big">${k}</span></div>
      <p class="reveal">${it.r}</p>${spkBtn(k)}
      <p class="hint">Practise the strokes in your course app too. You'll be tested on this in a moment.</p>
      <button class="primary" data-act="introok">Got it</button></div>`;
    if(S.settings.sound)autoSpeak(k);
    return;
  }
  if(type==='read'){
    const opts=pickOptions(it);
    app.innerHTML=`${bar()}<div class="stage"><p class="ask">What sound is this?</p><div class="sq"><span class="big">${k}</span></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-act="answer" data-k="${o.k}">${o.r}</button>`).join('')}</div>${DK}<div class="fb" id="fb"></div></div>`;
  }else if(type==='recall'){
    const opts=pickOptions(it);
    const optsHTML=`<div class="opts">${opts.map(o=>`<button class="opt ko" data-act="answer" data-k="${o.k}">${o.k}</button>`).join('')}</div>${DK}<div class="fb" id="fb"></div>`;
    // Half of recall cards become listening cards: sound only, no romaji
    sess.listen=canSpeak&&!sess.noSound&&Math.random()<0.5;
    if(sess.listen){
      app.innerHTML=`${bar()}<div class="stage"><p class="ask">Which hiragana did you hear?</p><div class="sq" id="lsq"><button class="play" data-act="speak" data-k="${k}" aria-label="Play the sound again">${PLAY_ICON}</button></div>
        ${optsHTML}<button class="link mute" data-act="nosound">Can't use sound right now</button></div>`;
      autoSpeak(k);
    }else{
      app.innerHTML=`${bar()}<div class="stage"><p class="ask">Which hiragana is this?</p><div class="sq"><span class="roma">${it.r}</span></div>${spkBtn(k)}
        ${optsHTML}</div>`;
      if(S.settings.sound)autoSpeak(k);
    }
  }else{
    app.innerHTML=`${bar()}<div class="stage"><p class="ask">Write this one</p><p class="romaline">${it.r}${spkBtn(k)}</p>
      <div class="wsq"><span class="model" id="model">${k}</span><canvas id="cv" aria-label="Drawing area"></canvas></div>
      <div class="btns2" id="wbtns"><button class="secondary" data-act="clear">Clear</button><button class="primary" data-act="check">Check</button></div></div>`;
    setupCanvas(document.getElementById('cv'));
    if(S.settings.sound)autoSpeak(k);
  }
}
function record(id,ok){
  grade(id,ok,sess.mode,performance.now()-sess.t0);
  ok?sess.right++:sess.wrong++;
  if(!ok&&sess.mode!=='placement'&&!sess.requeued.has(id)){
    sess.requeued.add(id);
    sess.queue.splice(Math.min(sess.queue.length,sess.pos+4),0,id);
  }
}
function answer(chosen){
  if(sess.answered)return;sess.answered=true;
  const id=sess.queue[sess.pos],[k,type]=id.split('|'),it=BY[k],ok=chosen===k,dk=chosen==='?';
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===k)b.classList.add('right');else if(b.dataset.k===chosen)b.classList.add('wrong');});
  {const d=document.querySelector('.dk');if(d)d.remove();}
  record(id,ok);
  if(dk){S.log[S.log.length-1].dk=true;save();}
  else if(!ok){S.log[S.log.length-1].c=chosen;save();} // remember what he picked, to spot mix-ups
  if(sess.listen){
    S.log[S.log.length-1].v='listen';save();
    const sq=document.getElementById('lsq');if(sq)sq.innerHTML=`<span class="roma">${it.r}</span>`;
    const m=document.querySelector('.mute');if(m)m.remove();
  }
  if(type==='read'&&S.settings.sound)speak(k);
  if(ok){ // move on after a short pause, but never before the sound has finished
    const pos=sess.pos;
    Promise.all([new Promise(r=>setTimeout(r,900)),soundDone]).then(()=>{if(sess&&sess.pos===pos&&sess.answered)next();});
    return;}
  const c=BY[chosen];
  const again=sess.mode==='placement'?'It will come up in your reviews.':'You\'ll see it again in a moment.';
  document.getElementById('fb').innerHTML=`<p><span class="kana">${k}</span> is <b>${it.r}</b>. ${dk?again:`<span class="kana">${c.k}</span> is <b>${c.r}</b>.`}</p>
    ${(type==='read'||sess.listen)&&canSpeak?spkBtn(k):''}<button class="primary" data-act="next" style="margin-top:12px">Next</button>`;
}
function next(){if(!sess)return;sess.pos++;renderCard();}
function renderDone(){
  const total=sess.right+sess.wrong;
  let title='Session done',sub=`${sess.right} right out of ${total}.`;
  if(sess.mode==='placement'){title='Check done';sub=`You knew ${sess.right} of ${total}. Any you missed will come up in your reviews until they stick.`;}
  else if(sess.wrong)sub+=' The ones you missed will come back soon.';
  const more=buildReview().length;
  app.innerHTML=`<header class="top"><h1>Hiragana drill</h1></header><section class="hero"><p class="lead">${title}</p><p class="sub">${sub}</p>
    ${more?`<button class="primary" data-act="review">Review ${more} more</button>`:''}
    <button class="${more?'secondary':'primary'}" data-act="practice">Keep practising</button>
    <button class="secondary" data-act="home">Back to chart</button></section>`;
  sess=null;
}

// ---------- Drawing ----------
function setupCanvas(cv){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,r.width*0.04);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1C2333';
  let drawing=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  cv.addEventListener('pointerdown',e=>{if(cv.dataset.locked)return;drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.stroke();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();});
  const end=()=>{drawing=false;};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.clear=()=>ctx.clearRect(0,0,cv.width,cv.height);
}

// ---------- Events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,row=b.dataset.row;
  switch(a){
    case 'review':closeSheet();startSession('review',buildReview());break;
    case 'practice':closeSheet();startSession('practice',buildPractice());break;
    case 'runall':closeSheet();startSession('practice',buildRunThrough());break;
    case 'home':closeSheet();renderHome();break;
    case 'settings':settingsSheet();break;
    case 'report':closeSheet();renderReport();break;
    case 'share':{
      const text=reportText();
      if(navigator.share)navigator.share({title:'Hiragana progress',text}).catch(err=>{if(!err||err.name!=='AbortError')copyText(text);});
      else copyText(text);
      break;}
    case 'close':closeSheet();break;
    case 'row':rowSheet(row);break;
    case 'rownew':if(!S.rows.includes(row))S.rows.push(row);save();closeSheet();renderHome();break;
    case 'rowadd':
      if(!S.rows.includes(row))S.rows.push(row);save();closeSheet();
      startSession('placement',shuffle([...ROWMAP[row].k].map(k=>k+'|read')));break;
    case 'rowpractice':closeSheet();startSession('practice',buildPractice(row));break;
    case 'rowremove':
      if(confirm('Remove this row from your chart? Its progress is kept if you add it back.')){S.rows=S.rows.filter(r=>r!==row);save();closeSheet();renderHome();}
      break;
    case 'speak':speak(b.dataset.k);break;
    case 'testvoice':(async()=>{for(const k of ['は','へ','を','ん'])await speak(k);})();break;
    case 'answer':answer(b.dataset.k);break;
    case 'next':next();break;
    case 'nosound':sess.noSound=true;renderCard();toast('Sound off for this session');break;
    case 'introok':{
      const id=sess.queue[sess.pos];
      S.cards[id]=newCard();save();
      sess.queue.splice(Math.min(sess.queue.length,sess.pos+4),0,id);
      next();break;}
    case 'clear':{const cv=document.getElementById('cv');if(cv&&cv.clear)cv.clear();break;}
    case 'check':
      document.getElementById('model').classList.add('show');
      document.getElementById('cv').dataset.locked='1';
      {const k=sess.queue[sess.pos].split('|')[0];
        document.getElementById('wbtns').insertAdjacentHTML('beforebegin',`<div class="ans" id="ans" role="img" aria-label="Correct answer: ${k}"><span class="kana">${k}</span></div>`);
        document.getElementById('ans').scrollIntoView({block:'nearest'});}
      document.getElementById('wbtns').innerHTML=`<button class="secondary" data-act="self" data-ok="0">Not quite</button><button class="primary" data-act="self" data-ok="1">Got it</button>`;
      break;
    case 'self':
      if(sess.answered)return;sess.answered=true;
      record(sess.queue[sess.pos],b.dataset.ok==='1');next();break;
    case 'copy':{
      const txt=JSON.stringify(S);
      const fallback=()=>{const ta=document.getElementById('restore');ta.value=txt;ta.select();toast('Select all and copy');};
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),fallback);else fallback();
      break;}
    case 'restore':{
      const txt=document.getElementById('restore').value.trim();
      try{const s=JSON.parse(txt);if(!s.rows||!s.cards)throw 0;
        if(confirm('Replace the progress on this phone with this backup?')){S=Object.assign(fresh(),s);if(!s.v)S.v=1;migrate();save();closeSheet();renderHome();toast('Backup restored');}
      }catch(err){toast('That backup could not be read');}
      break;}
    case 'reset':
      if(confirm('Reset all progress? This cannot be undone.')){S=fresh();save();closeSheet();renderHome();}
      break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='snd'){S.settings.sound=e.target.checked;save();}
  if(e.target.id==='wrt'){S.settings.write=e.target.checked;save();renderHome();}
  if(e.target.id==='voice'){S.settings.voice=e.target.value;save();speak('あ');}
});
if(hasTTS)speechSynthesis.getVoices();
renderHome();
// Keeps the page and voice clips on the phone so it works with no signal
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
