<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guide line test</title>
<!-- Throwaway test page for the missing vertical guide line on iPhone. Delete with the preview. -->
<link rel="stylesheet" href="css/style.css">
<style>
  body{padding:12px 16px 40px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid figure{margin:0}
  .grid figcaption{font-size:.8rem;margin-top:4px;line-height:1.3}
  .grid .wsq{width:100%}
  .solid::before{border-left-style:solid}
  .two::before{border-left-width:2px}
  .one::before{border-left-width:1px}
  .nogrid{display:block}
  .bg::before{border-left:0;width:1.5px;background:repeating-linear-gradient(var(--guide) 0 4.5px,transparent 4.5px 9px)}
  .el::before{content:none}
  .el i{position:absolute;left:50%;top:0;height:100%;border-left:1.5px dashed var(--guide)}
  .noab::before{top:0;bottom:0;height:auto}
  pre{white-space:pre-wrap;font-size:.75rem;background:var(--card);padding:10px;border-radius:8px}
</style></head>
<body>
<p><b>Guide line test.</b> Which boxes show a vertical dashed line? Screenshot the whole page, please (scroll down for the numbers).</p>
<div class="grid">
  <figure><div class="wsq" id="b1"><span class="model">ぬ</span><canvas></canvas></div><figcaption>A. As in the app</figcaption></figure>
  <figure><div class="wsq" id="b2"></div><figcaption>B. No canvas</figcaption></figure>
  <figure><div class="wsq solid" id="b3"></div><figcaption>C. Solid line</figcaption></figure>
  <figure><div class="wsq two" id="b4"></div><figcaption>D. 2px dashed</figcaption></figure>
  <figure><div class="wsq one" id="b5"></div><figcaption>E. 1px dashed</figcaption></figure>
  <figure><div class="wsq nogrid" id="b6"></div><figcaption>F. Not a grid</figcaption></figure>
  <figure><div class="wsq bg" id="b7"></div><figcaption>G. Drawn as a background, not a border</figcaption></figure>
  <figure><div class="wsq el" id="b8"><i></i></div><figcaption>H. Real element, not ::before</figcaption></figure>
  <figure><div class="wsq noab" id="b9"></div><figcaption>I. Old top/bottom version</figcaption></figure>
</div>
<pre id="o"></pre>
<script>
addEventListener('load',()=>{
  let css='?';try{css=[...document.styleSheets[0].cssRules].some(r=>/height:\s*100%/.test(r.cssText)&&/::before/.test(r.selectorText||''))?'new (height:100%)':'OLD';}catch(e){css='unreadable: '+e.message;}
  const lines=[`CSS: ${css}`,`DPR: ${devicePixelRatio}  viewport: ${innerWidth}x${innerHeight}`,navigator.userAgent];
  for(const id of ['b1','b2','b3','b4','b5','b6','b7','b8','b9']){
    const w=document.getElementById(id),b=getComputedStyle(w,'::before'),r=w.getBoundingClientRect();
    const i=w.querySelector('i'),ir=i&&i.getBoundingClientRect();
    lines.push(`${id}: box ${r.width.toFixed(2)}x${r.height.toFixed(2)} at x=${r.left.toFixed(2)} | ::before w=${b.width} h=${b.height} top=${b.top} left=${b.left} border=${b.borderLeftWidth} ${b.borderLeftStyle}`+(ir?` | <i> ${ir.width.toFixed(2)}x${ir.height.toFixed(2)}`:''));
  }
  document.getElementById('o').textContent=lines.join('\n');
});
</script>
</body></html>
